<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{% block title %}Checkie — Phishing URL Detector{% endblock %}</title>
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>

<header class="topbar">
  <a class="logo" href="{{ url_for('index') }}">Checkie</a>
  <nav class="nav">
    <a class="pill {{ 'pill--solid' if active_page != 'how' else 'pill--ghost' }}" href="{{ url_for('index') }}">Home</a>
    <a class="pill {{ 'pill--solid' if active_page == 'how' else 'pill--ghost' }}" href="{{ url_for('how_it_works') }}">How it works</a>
  </nav>
</header>

<main>
{% block content %}{% endblock %}
</main>

</body>
</html>
