[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishing-detector"
version = "0.1.0"
description = "Offline URL-based phishing signal extraction, classification, clustering, and scoring."
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "joblib",
    "interpret",
    "flask",
]

[tool.setuptools.packages.find]
where = ["src"]
